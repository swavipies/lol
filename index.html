<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yeah counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7'), auto; }

  @keyframes bgflash {
    0%   { background-color: #ff00ff; }
    16%  { background-color: #00ffff; }
    33%  { background-color: #ffff00; }
    50%  { background-color: #00ff00; }
    66%  { background-color: #ff0000; }
    83%  { background-color: #0000ff; }
    100% { background-color: #ff00ff; }
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @keyframes marquee {
    0%   { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.05); }
  }

  body {
    background-image:
      repeating-linear-gradient(45deg, #ff00ff 0px, #ff00ff 20px, #00ffff 20px, #00ffff 40px),
      repeating-linear-gradient(-45deg, #ffff00 0px, #ffff00 20px, #ff0000 20px, #ff0000 40px);
    background-blend-mode: difference;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
  }

  .marquee-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: #000;
    overflow: hidden;
    z-index: 12;
    border-bottom: 5px double #ffff00;
  }

  .marquee-text {
    white-space: nowrap;
    color: #00ff00;
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: 22px;
    line-height: 40px;
    text-shadow: 2px 2px 0 red, -2px -2px 0 blue;
    animation: marquee 6s linear infinite;
    display: inline-block;
  }

  #counter {
    position: fixed;
    top: 40px;
    left: 0;
    right: 0;
    background: #ff00ff;
    animation: bgflash 1.5s infinite steps(6);
    color: #ffff00;
    text-align: center;
    padding: 14px 8px;
    font-size: 26px;
    font-weight: 900;
    border-bottom: 8px ridge #00ff00;
    border-top: 4px dotted #fff;
    z-index: 10;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #0ff;
    letter-spacing: 2px;
  }

  #counter span {
    font-size: 40px;
    color: #fff;
    background: #ff0000;
    padding: 0 10px;
    border: 3px outset #ffff00;
    animation: blink 0.7s steps(1) infinite;
  }

  #marquee-blink {
    color: #ffff00;
    animation: blink 0.5s steps(1) infinite;
  }

  #spacer {
    height: 100px;
  }

  #visitor-badge {
    background: #000080;
    color: #00ff00;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 12px;
    margin: 10px auto;
    max-width: 320px;
    border: 4px double #ff00ff;
    font-size: 14px;
    box-shadow: 6px 6px 0 #000, 0 0 25px #ffff00;
    animation: wiggle 2.5s ease-in-out infinite;
  }

  #visitor-badge b {
    color: #ff0000;
    font-size: 20px;
    text-shadow: 1px 1px 0 #fff;
  }

  .yeah {
    font-size: 40px;
    font-weight: bold;
    color: #0000ff;
    text-align: center;
    padding: 10px;
    user-select: none;
    -webkit-text-stroke: 1px yellow;
    text-shadow: 4px 4px 0 #ff00ff, -2px -2px 0 #00ffff;
  }

  .yeah:nth-child(odd) {
    color: #ff0000;
    transform: rotate(-8deg);
    -webkit-text-stroke: 1px lime;
  }
  .yeah:nth-child(3n) {
    color: #009900;
    transform: rotate(8deg);
    -webkit-text-stroke: 1px orange;
  }
  .yeah:nth-child(5n) {
    background: #ffff00;
    display: inline-block;
    padding: 4px 14px;
    border: 3px dashed #ff00ff;
  }
  .yeah:nth-child(7n) {
    font-size: 80px;
    animation: wiggle 1.2s infinite;
  }
  .yeah:nth-child(11n) {
    color: #ff00ff;
    transform: rotate(-15deg) scale(1.3);
    text-shadow: 5px 5px 0 #000;
  }

  #bottom {
    text-align: center;
    font-size: 20px;
    padding: 40px;
    color: #ffff00;
    background: #ff00ff;
    border-top: 10px groove #00ff00;
    border-bottom: 10px groove #00ff00;
    text-shadow: 2px 2px 0 #000;
  }

  #bottom a {
    color: #00ffff;
    text-decoration: blink underline;
    font-weight: bold;
    background: #000;
    padding: 4px 10px;
    border: 3px outset #fff;
    animation: blink 1s steps(1) infinite;
  }

  .yeah-link {
    text-decoration: none;
    display: inline-block;
  }

  .yeah-link:hover {
    text-decoration: underline wavy;
  }
</style>
</head>
<body>

<div class="marquee-wrap">
  <div class="marquee-text">***VIBECODED IN ISRAEL!!!*** <span id="marquee-blink">GLORY TO ISRAEL CLAUDE</span> ***GLORY TO STRATA DEVELOPMENT TEAM***THIS WAS WRITTEN IN ASSEMBLY*** </div>
</div>

<div id="spacer"></div>
<div id="counter">yeahs scrolled past: <span id="count">0</span></div>

<div id="visitor-badge">
  YOU ARE VISITOR NUMBER<br>
  <b>0000420</b><br>
  SINCE 1999
</div>

<div id="yeah-container"></div>

<div id="bottom">that's all of them. congratulations. i know u prolly just used the scroll bar tho. <br><a href="https://guns.lol/swavi" target="_blank" rel="noopener">guns.lol/swavi</a></div>

<script>
  const container = document.getElementById('yeah-container');
  const TOTAL = 3000;
  const frag = document.createDocumentFragment();

  const EASTER_EGG_INDEX = 1337;

  for (let i = 0; i < TOTAL; i++) {
    const el = document.createElement('div');
    el.className = 'yeah';

    if (i === EASTER_EGG_INDEX) {
      const link = document.createElement('a');
      link.href = 'https://guns.lol/swavi';
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'yeah-link';
      link.style.color = 'inherit';
      link.textContent = 'yeah';
      el.appendChild(link);
    } else {
      el.textContent = 'yeah';
    }

    frag.appendChild(el);
  }
  container.appendChild(frag);

  const yeahs = document.querySelectorAll('.yeah');
  const countEl = document.getElementById('count');

  function updateCount() {
    let passed = 0;
    for (const y of yeahs) {
      if (y.getBoundingClientRect().bottom < 100) {
        passed++;
      } else {
        break;
      }
    }
    countEl.textContent = passed;
  }

  window.addEventListener('scroll', updateCount, { passive: true });
  updateCount();
</script>

</body>
</html>
